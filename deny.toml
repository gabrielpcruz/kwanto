[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
ignore = [
  # time (via wry → cookie): DoS ao interpretar datas RFC 2822 hostis. O wry só monta cookies
  # (CookieBuilder) e o Kwanto não chama nenhuma API de cookie: nenhuma data de terceiros é
  # interpretada. A versão corrigida exige Rust mais novo que o MSRV (1.85).
  { id = "RUSTSEC-2026-0009", reason = "nenhuma data RFC 2822 de terceiros é interpretada; correção exige Rust > MSRV" },
  # proc-macro-error (via glib-macros 0.18): sem manutenção, só usado na compilação.
  { id = "RUSTSEC-2024-0370", reason = "macro de compilação do gtk-rs 0.18; sem substituto no wry atual" },
]
