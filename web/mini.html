<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kwanto</title>
<link href="/static/tema.css" rel="stylesheet">
<style>
html, body { margin: 0; background: transparent; }
body { font: 14px/1.4 var(--f-tit); color: var(--tinta); -webkit-user-select: none; user-select: none; cursor: default; }
.cartao { width: 360px; background: var(--sup); border: 1px solid var(--grade-2); border-radius: 6px; overflow: hidden; }
.topo { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--grade-2); }
.marca { display: flex; gap: 7px; align-items: center; font-weight: 600; font-stretch: 112%; font-size: 13.5px; }
.marca svg { width: 15px; height: 15px; color: var(--fio); }
.miolo { padding: 12px 14px 14px; display: grid; gap: 12px; }
.leitura { display: flex; justify-content: space-between; align-items: flex-end; }
.w { font-weight: 600; font-stretch: 118%; font-size: 54px; line-height: .9; letter-spacing: -.03em; }
.w small { font-size: 18px; font-weight: 500; color: var(--apagado); margin-left: 4px; letter-spacing: 0; }
.custo { font-family: var(--f-num); font-size: 12px; color: var(--apagado); text-align: right; }
.custo b { display: block; color: var(--tinta); font-size: 17px; font-weight: 500; }
.mini svg { display: block; width: 100%; height: auto; }
.mini-leg { display: flex; gap: 14px; font-size: 11.5px; color: var(--apagado); margin-top: 6px; }
.mini-leg span { display: flex; align-items: center; gap: 5px; }
.mini-leg .simb { width: 13px; height: 13px; }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--grade-2); }
.tres > div { padding: 6px 9px; min-width: 0; }
.tres > div + div { border-left: 1px solid var(--grade-2); }
.tres small { display: block; font-size: 11px; color: var(--apagado); }
.tres b { font-family: var(--f-num); font-weight: 500; font-size: 14px; }
.tres .prev b { color: var(--fio); }
.acoes { display: flex; gap: 8px; }
.acoes .btn:first-child { flex: 1; }
.parado p { margin: 0 0 8px; color: var(--apagado); }
.parado code { display: block; background: var(--papel); border: 1px solid var(--grade-2); padding: 8px 10px; font: 12.5px var(--f-num);
  -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<div class="cartao" id="cartao">
  <div class="topo">
    <div class="marca"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M1 11h5l2.5-7 5 14L16 11h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg><span><span class="kw">Kw</span>anto</span></div>
    <div class="status"><span class="on" id="st-vivo">conectando</span><b id="st-hora"></b></div>
  </div>
  <div class="miolo">
    <div id="conteudo">
      <div class="leitura">
        <div class="w num" id="w">–<small>W</small></div>
        <div class="custo">custo agora<b id="custo">–</b></div>
      </div>
      <div class="mini" style="margin-top:12px"><svg id="fluxo-mini" role="img" aria-label="Divisão do consumo"></svg>
        <div class="mini-leg" id="leg"></div></div>
    </div>
    <div class="parado" id="parado" hidden>
      <p>O monitor não está rodando, então não há leituras para mostrar. Inicie o serviço com:</p>
      <code>sudo systemctl start kwantod</code>
    </div>
    <div class="tres" id="tres">
      <div><small>Hoje</small><b class="num" id="hoje">–</b></div>
      <div><small>Conta atual</small><b class="num" id="ciclo">–</b></div>
      <div class="prev"><small id="prev-r">Previsão</small><b class="num" id="prev">–</b></div>
    </div>
    <div class="acoes">
      <button class="btn" id="abrir" type="button">Abrir dashboard</button>
      <button class="btn sec" id="sair" type="button" title="Remover o ícone da barra" aria-label="Remover o ícone da barra">
        <svg class="simb" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2v6M5 4.6a6 6 0 1 0 8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</div>
<script src="/static/unifilar.js"></script>
<script src="/static/mini.js"></script>
</body>
</html>
