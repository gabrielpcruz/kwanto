[package]
name = "kwantod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kwantod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
jiff = "0.2.38"
kwanto-api = { version = "0.1.0", path = "../../crates/kwanto-api" }
kwanto-app = { version = "0.1.0", path = "../../crates/kwanto-app" }
kwanto-core = { version = "0.1.0", path = "../../crates/kwanto-core" }
kwanto-ext = { version = "0.1.0", path = "../../crates/kwanto-ext" }
kwanto-sensors = { version = "0.1.0", path = "../../crates/kwanto-sensors" }
kwanto-store = { version = "0.1.0", path = "../../crates/kwanto-store" }
rustix = { version = "1.1.5", features = ["time", "process"] }
sd-notify = "0.5.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[dev-dependencies]
async-trait = "0.1.92"
jiff = "0.2.38"
kwanto-core = { path = "../../crates/kwanto-core", features = ["testes"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.152"
tempfile = "3.27.0"
