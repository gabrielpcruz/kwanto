[package]
name = "kwanto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kwanto"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures-util = "0.3.34"
gdkx11 = "0.18"
gtk = "0.18"
kwanto-atualizacao = { version = "0.1.0", path = "../../crates/kwanto-atualizacao" }
kwanto-core = { version = "0.1.0", path = "../../crates/kwanto-core" }
open = "5.4.4"
resvg = "0.48.1"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tao = "0.37.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", default-features = false }
wry = "0.57.0"
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[dev-dependencies]
minisign = "0.10.0"
tempfile = "3.27.0"
