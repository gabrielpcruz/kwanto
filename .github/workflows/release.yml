name: release
# Tag vX.Y.Z → testes, compilação de conferência e um release em RASCUNHO, sem arquivos.
# Os pacotes publicados são compilados, assinados e enviados pelo mantenedor na própria máquina
# (scripts/publicar-versao.sh): nem a chave nem os pacotes oficiais passam pelo CI.
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  testes:
    # 22.04: a mesma base em que os pacotes oficiais são compilados.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev dbus
      - run: cargo test --workspace --all-features --locked
      - run: sh scripts/instalar-nfpm.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: sh scripts/gerar-pacotes.sh
      - name: Versão da tag confere com o Cargo.toml
        run: test -f "dist/kwanto_${GITHUB_REF_NAME#v}_amd64.deb"
  rascunho:
    needs: testes
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --title "Kwanto ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
