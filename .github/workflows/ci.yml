name: ci
on: [push, pull_request]
# Nenhum job precisa escrever no repositório; actions de terceiros fixadas por commit.
permissions:
  contents: read
jobs:
  linux:
    # Tudo num script só (scripts/verificar.sh): o mesmo que se roda localmente antes de publicar.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # a barreira confere o histórico inteiro
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev dbus
      - run: sh scripts/verificar.sh
  windows-dominio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo check -p kwanto-core -p kwanto-app -p kwanto-store -p kwanto-api -p kwanto-ext
  msrv:
    # Garante que o rust-version = "1.85" do Cargo.toml continue verdadeiro.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev dbus
      - run: cargo +1.85 check --workspace --all-targets --all-features --locked
